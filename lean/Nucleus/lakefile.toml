name = "Nucleus"
version = "0.1.0"
defaultTargets = ["Nucleus"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Every file here carries an SPDX header, the form REUSE.toml declares for the
# whole repository. Mathlib's header linter checks for its own Apache-2.0
# boilerplate instead — it requires the line "Copyright (c) YYYY … All rights
# reserved.", which is the opposite of what CC0-1.0 says — so it is off.
weak.linter.style.header = false
maxSynthPendingDepth = 3

# Pinned alongside lean-toolchain; bump both together.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "Nucleus"
