name = "Nucleus"
version = "0.1.0"
defaultTargets = ["Nucleus"]

[leanOptions]
warningAsError = true
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# Licensing is declared centrally in REUSE.toml, which annotates `**`; no file
# in this repository carries a per-file copyright header. Mathlib's header
# linter requires one, in its own Apache-2.0 wording, so it is off.
weak.linter.style.header = false
maxSynthPendingDepth = 3

# Pinned alongside lean-toolchain; bump both together.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

# Reuse CSLib's locally nameless beta/eta confluence and STLC normalization.
[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "810849d47d1084f2e98844d316091845c561bb25"

[[lean_lib]]
name = "Nucleus"
# Lean intentionally contains several related formal designs. Validate every
# checked-in module; the root import list only defines the public library API.
globs = ["Nucleus.+"]
