[package]
name = "glu"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "CC0-1.0"
description = "Repository tooling for Nucleus"
publish = false

[workspace]

[dependencies]
cargo_metadata = "0.23.1"
cargo-lock = "11.0.1"
clap = { version = "4.5.47", features = ["derive"] }
color-eyre = "0.6.5"
minijinja = { version = "2.12.0", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
