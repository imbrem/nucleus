[workspace]
members = [
  "crates/lib/bigint",
  "crates/lib/error",
  "crates/lib/crypto",
  "crates/lib/cbor",
  "crates/lib/hash",
  "crates/lib/json",
  "crates/lib/parse",
  "crates/lib/python",
  "crates/lib/rand",
  "crates/lib/serde",
  "crates/lib/sqlite",
  "crates/lib/table",
  "crates/lib/wasm",
  "crates/logic/cas",
  "crates/logic/classical",
  "crates/logic/lrat",
  "crates/logic/metamath",
  "crates/logic/sat",
  "crates/logic/hol",
  "crates/logic/hol-derived",
  "crates/logic/hol-script",
  "crates/data/array",
  "crates/data/basic",
  "crates/data/cbor",
  "crates/data/num",
    "crates/data/cas",
    "crates/data/cas-sqlite",
    "crates/data/cas-http",
  "crates/data/container",
  "crates/ffi/python",
  "crates/proton",
  "crates/neutron",
  "crates/nucleus",
  "crates/proof/demo",
  "crates/proof/invalid-demo",
  "crates/proof/host",
  "crates/repl",
  "crates/browser",
  "crates/bin/cas-serve",
  "crates/bin/cas-shell",
  "crates/bin/nucleus",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "CC0-1.0"
rust-version = "1.97"
version = "0.0.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Wasm a browser has to download before anything runs. Size is the cost that
# is actually paid, and the code being made smaller is a SQL shell over a
# handful of objects, so trading throughput for bytes is the right way round.
# A separate profile rather than `release` because native builds want the
# opposite trade.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
# The name section is 86 KiB of function names for C code nobody debugs from
# the browser. This also drops `target_features`, which matters only to a
# post-processing step this build does not have.
strip = "symbols"
