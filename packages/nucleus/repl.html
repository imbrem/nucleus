<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nucleus SQL connections</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, "Cascadia Code", monospace;
      }
      body {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 70rem;
        padding: 2rem;
      }
      h1 {
        font: inherit;
        font-size: 1.4rem;
      }
      .bar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 1rem 0;
      }
      input,
      select,
      button,
      textarea {
        font: inherit;
      }
      input[type="url"] {
        flex: 1 1 24rem;
      }
      textarea {
        box-sizing: border-box;
        min-height: 12rem;
        padding: 0.75rem;
        resize: vertical;
        width: 100%;
      }
      table {
        border-collapse: collapse;
        margin-top: 1rem;
        width: 100%;
      }
      th,
      td {
        border: 1px solid currentColor;
        padding: 0.4rem;
        text-align: left;
      }
      #status,
      #output {
        white-space: pre-wrap;
      }
      .error {
        color: #d33;
      }
    </style>
  </head>
  <body>
    <h1>Nucleus SQL and HOL-omega connections</h1>
    <p>
      One Worker kernel manages heterogeneous connections. SQL sessions have a
      writable in-memory main database; HOL sessions expose only their
      policy-enclosed operations.
    </p>

    <div class="bar">
      <label for="connection">Connection</label>
      <select id="connection"></select>
      <button id="new" type="button">New SQL connection</button>
      <button id="new-hol" type="button">New HOL connection</button>
      <button id="close" type="button">Close connection</button>
      <button id="export" type="button">Export main snapshot</button>
    </div>

    <div class="bar">
      <input
        id="url"
        type="url"
        placeholder="https://example.test/database.sqlite"
      />
      <input id="schema" value="library" aria-label="Schema name" />
      <button id="load" type="button">Load immutable image</button>
    </div>

    <label for="sql">One SQLite statement</label>
    <textarea id="sql">SELECT sqlite_version() AS sqlite_version</textarea>
    <div class="bar">
      <button id="run" type="button">Run</button>
      <span id="status" role="status">Starting Worker…</span>
    </div>
    <div id="output" aria-live="polite"></div>

    <h2>HOL-omega kinds</h2>
    <div class="bar">
      <button id="hol-star" type="button">Intern star</button>
      <input
        id="hol-domain"
        inputmode="numeric"
        value="1"
        aria-label="Domain kind ID"
      />
      <input
        id="hol-codomain"
        inputmode="numeric"
        value="1"
        aria-label="Codomain kind ID"
      />
      <button id="hol-arrow" type="button">Intern arrow</button>
      <input id="hol-id" inputmode="numeric" value="1" aria-label="Kind ID" />
      <button id="hol-show" type="button">Show kind</button>
      <button id="hol-rank" type="button">Show rank</button>
      <button id="hol-term-demo" type="button">Build typed application</button>
      <button id="hol-proof-demo" type="button">Prove in context</button>
      <button id="hol-binding-demo" type="button">Build identity lambda</button>
    </div>

    <script type="module">
      import { createBrowserRepl } from "./dist/index.js";

      const repl = createBrowserRepl();
      const connections = new Map();
      let nextConnection = 1;

      const connectionSelect = document.querySelector("#connection");
      const status = document.querySelector("#status");
      const output = document.querySelector("#output");

      function selected() {
        const connection = connections.get(connectionSelect.value);
        if (connection === undefined) throw new Error("no open connection");
        return connection;
      }

      function selectedProtocol(protocol) {
        const selectedConnection = selected();
        if (selectedConnection.protocol !== protocol)
          throw new Error(
            `selected connection uses ${selectedConnection.protocol}; operation requires ${protocol}`,
          );
        return selectedConnection.connection;
      }

      async function addConnection(protocol) {
        const id = String(nextConnection++);
        const connection =
          protocol === "sql" ? await repl.open() : await repl.openHol();
        connections.set(id, { protocol, connection });
        const option = document.createElement("option");
        option.value = id;
        option.textContent = `${protocol} connection ${id}`;
        connectionSelect.append(option);
        connectionSelect.value = id;
        status.textContent = `${option.textContent} ready`;
      }

      function showError(error) {
        output.replaceChildren();
        output.className = "error";
        output.textContent =
          error instanceof Error ? error.message : String(error);
        status.textContent = "Failed";
      }

      function formatValue(value) {
        switch (value.kind) {
          case "null":
            return "NULL";
          case "blob":
            return `x'${Array.from(value.value, (byte) =>
              byte.toString(16).padStart(2, "0"),
            ).join("")}'`;
          default:
            return String(value.value);
        }
      }

      function showOutcome(outcome) {
        output.replaceChildren();
        output.className = "";
        if (outcome.kind === "changed") {
          output.textContent = `changed ${outcome.changed}`;
          return;
        }
        const table = document.createElement("table");
        const head = table.createTHead().insertRow();
        for (const column of outcome.columns) {
          const cell = document.createElement("th");
          cell.textContent = column;
          head.append(cell);
        }
        const body = table.createTBody();
        for (const row of outcome.rows) {
          const tableRow = body.insertRow();
          for (const value of row)
            tableRow.insertCell().textContent = formatValue(value);
        }
        output.append(table);
      }

      document.querySelector("#new").addEventListener("click", async () => {
        try {
          await addConnection("sql");
        } catch (error) {
          showError(error);
        }
      });

      document.querySelector("#new-hol").addEventListener("click", async () => {
        try {
          await addConnection("hol");
        } catch (error) {
          showError(error);
        }
      });

      document.querySelector("#close").addEventListener("click", async () => {
        try {
          const id = connectionSelect.value;
          await selected().connection.close();
          connections.delete(id);
          connectionSelect.selectedOptions[0]?.remove();
          status.textContent =
            connections.size === 0 ? "No open connection" : "Ready";
        } catch (error) {
          showError(error);
        }
      });

      document.querySelector("#run").addEventListener("click", async () => {
        status.textContent = "Running…";
        try {
          showOutcome(
            await selectedProtocol("sql").run(
              document.querySelector("#sql").value,
            ),
          );
          status.textContent = "Ready";
        } catch (error) {
          showError(error);
        }
      });

      document.querySelector("#load").addEventListener("click", async () => {
        status.textContent = "Downloading complete image…";
        try {
          const hash = await selectedProtocol("sql").loadUrl(
            document.querySelector("#url").value,
            document.querySelector("#schema").value,
          );
          output.className = "";
          output.textContent = `attached ${hash}`;
          status.textContent = "Ready";
        } catch (error) {
          showError(error);
        }
      });

      document.querySelector("#export").addEventListener("click", async () => {
        try {
          const image = await selectedProtocol("sql").serializeMain();
          const url = URL.createObjectURL(new Blob([image]));
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = "nucleus.sqlite";
          anchor.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          showError(error);
        }
      });

      document
        .querySelector("#hol-star")
        .addEventListener("click", async () => {
          try {
            const id = await selectedProtocol("hol").star();
            output.textContent = `kind ${id} = star`;
          } catch (error) {
            showError(error);
          }
        });

      document
        .querySelector("#hol-arrow")
        .addEventListener("click", async () => {
          try {
            const domain = Number(document.querySelector("#hol-domain").value);
            const codomain = Number(
              document.querySelector("#hol-codomain").value,
            );
            const id = await selectedProtocol("hol").arrow(domain, codomain);
            output.textContent = `kind ${id} = ${domain} -> ${codomain}`;
            document.querySelector("#hol-id").value = String(id);
          } catch (error) {
            showError(error);
          }
        });

      document
        .querySelector("#hol-show")
        .addEventListener("click", async () => {
          try {
            const id = Number(document.querySelector("#hol-id").value);
            const kind = await selectedProtocol("hol").kind(id);
            output.textContent =
              kind.kind === "star"
                ? `kind ${id} = star`
                : `kind ${id} = ${kind.domain} -> ${kind.codomain}`;
          } catch (error) {
            showError(error);
          }
        });

      document
        .querySelector("#hol-rank")
        .addEventListener("click", async () => {
          try {
            const id = Number(document.querySelector("#hol-id").value);
            const rank = await selectedProtocol("hol").rank(id);
            output.textContent = `rank ${id} = ${rank}`;
          } catch (error) {
            showError(error);
          }
        });

      document
        .querySelector("#hol-term-demo")
        .addEventListener("click", async () => {
          try {
            const hol = selectedProtocol("hol");
            const boolType = await hol.boolType();
            const functionType = await hol.arrowType(boolType, boolType);
            const functionTerm = await hol.freeTerm(100, functionType);
            const argumentTerm = await hol.freeTerm(101, boolType);
            const application = await hol.application(
              functionTerm,
              argumentTerm,
            );
            const type = await hol.termType(application);
            const free = await hol.termFreeVariables(application);
            output.textContent = `term ${application} : ${type}; freevars = ${free.join(",")}`;
          } catch (error) {
            showError(error);
          }
        });

      document
        .querySelector("#hol-proof-demo")
        .addEventListener("click", async () => {
          try {
            const hol = selectedProtocol("hol");
            const boolType = await hol.boolType();
            const functionType = await hol.arrowType(boolType, boolType);
            const functionTerm = await hol.freeTerm(100, functionType);
            const argumentTerm = await hol.freeTerm(101, boolType);
            const application = await hol.application(
              functionTerm,
              argumentTerm,
            );
            const context = await hol.defineContext([application]);
            const theorem = await hol.proveHypothesis(context, application);
            const truth = await hol.proveTruth(0);
            const proved = await hol.proved(context, application);
            output.textContent = `context ${context}; theorem ${context} |- ${theorem}; truth 0 |- ${truth}; proved = ${proved}`;
          } catch (error) {
            showError(error);
          }
        });

      document
        .querySelector("#hol-binding-demo")
        .addEventListener("click", async () => {
          try {
            const hol = selectedProtocol("hol");
            const boolType = await hol.boolType();
            const variable = await hol.boundTerm(0, boolType);
            const unbound = await hol.termUnboundVariables(variable);
            const variableClosed = await hol.termIsLocallyClosed(variable);
            const identity = await hol.lambda(boolType, variable);
            const identityType = await hol.termType(identity);
            const identityClosed = await hol.termIsLocallyClosed(identity);
            output.textContent = `bound ${variable} unbound=${unbound.map(({ index, type }) => `${index}:${type}`).join(",")} closed=${variableClosed}; lambda ${identity} : ${identityType} closed=${identityClosed}`;
          } catch (error) {
            showError(error);
          }
        });

      addEventListener("beforeunload", () => repl.close());
      try {
        await addConnection("sql");
      } catch (error) {
        showError(error);
      }
    </script>
  </body>
</html>
