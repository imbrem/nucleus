<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nucleus</title>
    <style>
      :root {
        color-scheme: light dark;
        --line: color-mix(in oklab, currentColor 18%, transparent);
        --soft: color-mix(in oklab, currentColor 55%, transparent);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      header {
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      header strong {
        font-weight: 600;
      }
      header .hint {
        color: var(--soft);
      }
      header label {
        color: var(--soft);
        cursor: pointer;
        text-decoration: underline dotted;
      }
      header input[type="file"] {
        display: none;
      }
      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 0.8rem 1rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #transcript .echo {
        color: var(--soft);
      }
      #transcript .bad {
        color: #d14;
      }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        border-top: 1px solid var(--line);
        align-items: baseline;
      }
      form span {
        color: var(--soft);
      }
      input[type="text"] {
        flex: 1;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        outline: none;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>nucleus</strong>
      <span class="hint">the same REPL the terminal runs, in a page</span>
      <label for="file">admit a file…</label>
      <input id="file" type="file" accept=".sqlite,.db,.sqlite3" />
    </header>

    <div id="transcript"></div>

    <form id="prompt">
      <span>nucleus&gt;</span>
      <input
        id="line"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        autofocus
      />
    </form>

    <script type="module">
      import { init, Repl, drive } from "./dist/index.js";

      await init();
      const repl = new Repl();
      const host = { shell: () => fetch("./generated/shell.wasm") };

      const transcript = document.getElementById("transcript");
      const line = document.getElementById("line");

      function write(text, className) {
        if (!text) return;
        const node = document.createElement("div");
        if (className) node.className = className;
        node.textContent = text;
        transcript.append(node);
        transcript.scrollTop = transcript.scrollHeight;
      }

      write(repl.banner());

      // A page has no filesystem, so an empty store means nothing to try.
      // `(samples)` is a REPL form, not a page feature: the terminal has the
      // same one, and both get their databases from the same place.
      const samples = (await drive(repl, host, "(samples)")).output;
      const demos = [...samples.matchAll(/\((\w+) ([0-9a-f]{64})\)/g)].map(
        ([, name, address]) => ({ name, address }),
      );
      write(
        [
          "",
          "In the store:",
          ...demos.map(({ name, address }) => `  ${name.padEnd(10)}${address}`),
          "",
          "Try:",
          "  (help)                            every form",
          "  (objects)                         what the store holds",
          "  (sqlite ADDRESS)                  the real sqlite3, in wasm",
          '  (connect "http://127.0.0.1:8080") a kernel in another process',
          "  (fetch ADDRESS)                   pull an object and verify it",
          "",
          "Paste an address from above wherever ADDRESS appears.",
          "",
          "Inside sqlite, every object in the store is one ATTACH away:",
          `  ATTACH 'file:${demos[1].address}?vfs=cas' AS m;`,
          "",
          "`glu demo` starts a kernel and prints an address to paste.",
          "",
        ].join("\n"),
        "echo",
      );

      // History, because a REPL without it is a form with extra steps.
      const history = [];
      let cursor = 0;

      document
        .getElementById("prompt")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const text = line.value;
          line.value = "";
          if (!text.trim()) return;

          history.push(text);
          cursor = history.length;
          write(`nucleus> ${text}`, "echo");

          const result = await drive(repl, host, text);
          write(
            result.output,
            result.output.startsWith("error:") ? "bad" : undefined,
          );
          if (result.quit) {
            write("(a page cannot quit; reload to start over)", "echo");
          }
        });

      line.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        event.preventDefault();
        cursor += event.key === "ArrowUp" ? -1 : 1;
        cursor = Math.max(0, Math.min(cursor, history.length));
        line.value = history[cursor] ?? "";
      });

      // A page has no filesystem, so `(put …)` cannot work here. This is the
      // affordance that replaces it.
      document
        .getElementById("file")
        .addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          try {
            const bytes = new Uint8Array(await file.arrayBuffer());
            write(`nucleus> (put ${JSON.stringify(file.name)})`, "echo");
            write(repl.admit(bytes));
          } catch (error) {
            write(`error: ${error}`, "bad");
          }
          event.target.value = "";
        });
    </script>
  </body>
</html>
