<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nucleus inter-kernel signed HOL test</title>
  </head>
  <body>
    <script type="module">
      import {
        BrowserWitHolKernel,
        createBrowserReplDirectory,
      } from "../dist/index.js";

      const directory = createBrowserReplDirectory();
      let producerKernel;
      let receiverKernel;
      let producer;
      let receiver;
      let receiverProbe;
      let wrongNamespaceReceiver;
      let witProducerConnection;
      let witReceiverConnection;
      try {
        producerKernel = await directory.spawnWorker("worker:producer");
        receiverKernel = await directory.spawnWorker("worker:receiver");
        producer = await producerKernel.openHol();
        receiver = await receiverKernel.openHol();
        receiverProbe = await receiverKernel.openHol();
        wrongNamespaceReceiver = await receiverKernel.openHol();

        const registeredKernels = await directory.kernels();
        const registeredConnections = await directory.connections();
        await directory.select(producer.id);
        const selectedProducer = (await directory.active()) === producer.id;
        await directory.select(receiver.id);
        const selectedReceiver = (await directory.active()) === receiver.id;
        let liveKernelCloseError = "";
        try {
          await producerKernel.close();
        } catch (error) {
          liveKernelCloseError = String(error);
        }

        const produced = await producer.produceSignedArtifact();
        const receiverProduced = await receiverProbe.produceSignedArtifact();
        const distinctKernels =
          produced.artifact.signer !== receiverProduced.artifact.signer &&
          produced.artifact.signer === producerKernel.signer &&
          receiverProduced.artifact.signer === receiverKernel.signer;

        const originalImageLength = produced.artifact.image.byteLength;
        const originalPublicKeyLength = produced.artifact.publicKey.byteLength;
        const originalSignatureLength = produced.artifact.signature.byteLength;

        const wrongBytes = {
          ...produced.artifact,
          image: produced.artifact.image.slice(),
        };
        wrongBytes.image[0] ^= 1;
        let wrongBytesError = "";
        try {
          await receiver.authenticateSignedArtifact(
            producerKernel.id,
            wrongBytes,
          );
        } catch (error) {
          wrongBytesError = String(error);
        }

        const wrongSignature = {
          ...produced.artifact,
          signature: produced.artifact.signature.slice(),
        };
        wrongSignature.signature[0] ^= 1;
        let wrongSignatureError = "";
        try {
          await receiver.authenticateSignedArtifact(
            producerKernel.id,
            wrongSignature,
          );
        } catch (error) {
          wrongSignatureError = String(error);
        }

        const beforePin = await receiver.stateImageHash();
        let validAttackerKeyError = "";
        try {
          await receiver.authenticateSignedArtifact(
            producerKernel.id,
            receiverProduced.artifact,
          );
        } catch (error) {
          validAttackerKeyError = String(error);
        }
        const afterAttacker = await receiver.stateImageHash();
        const pinned = await receiver.authenticateSignedArtifact(
          producerKernel.id,
          produced.artifact,
        );
        const afterPin = await receiver.stateImageHash();
        const received = await pinned.trustAndReceive();

        let wrongNamespaceError = "";
        try {
          const wrongNamespace =
            await wrongNamespaceReceiver.authenticateSignedArtifact(
              producerKernel.id,
              {
                ...produced.artifact,
                namespace: String(BigInt(produced.artifact.namespace) + 1n),
              },
            );
          await wrongNamespace.trustAndReceive();
        } catch (error) {
          wrongNamespaceError = String(error);
        }

        // Exercise the sibling WIT-shaped surface through the same two real
        // independently keyed Worker kernels.
        const witProducer = new BrowserWitHolKernel(producerKernel);
        const witReceiver = new BrowserWitHolKernel(receiverKernel);
        const witProducerIdentity = await witProducer.identity();
        const witReceiverIdentity = await witReceiver.identity();
        witProducerConnection = await witProducer.open();
        witReceiverConnection = await witReceiver.open();
        const witProduced = await witProducerConnection.betaSignExport();
        const witAttackerProduced =
          await witReceiverConnection.betaSignExport();
        const witWrongSignature = {
          ...witProduced.artifact,
          signature: witProduced.artifact.signature.slice(),
        };
        witWrongSignature.signature[0] ^= 1;
        let witWrongSignatureError = "";
        try {
          await witReceiverConnection.authenticate(
            witProducerIdentity.directoryId,
            witWrongSignature,
          );
        } catch (error) {
          witWrongSignatureError = String(error);
        }
        const witBeforePin = await witReceiverConnection.stateImageHash();
        let witAttackerKeyError = "";
        try {
          await witReceiverConnection.authenticate(
            witProducerIdentity.directoryId,
            witAttackerProduced.artifact,
          );
        } catch (error) {
          witAttackerKeyError = String(error);
        }
        const witAfterAttacker = await witReceiverConnection.stateImageHash();
        const witPinned = await witReceiverConnection.authenticate(
          witProducerIdentity.directoryId,
          witProduced.artifact,
        );
        const witAfterPin = await witReceiverConnection.stateImageHash();
        const witReceived = await witPinned.trustImport();
        await witProducerConnection.close();
        witProducerConnection = undefined;
        await witReceiverConnection.close();
        witReceiverConnection = undefined;

        await producer.close();
        await producerKernel.close();
        const afterProducerClose = {
          kernels: (await directory.kernels()).length,
          connections: (await directory.connections()).length,
        };
        const receiverAfterProducerClose = await receiver.run("truth");
        await receiver.close();
        await receiverProbe.close();
        await wrongNamespaceReceiver.close();
        await receiverKernel.close();
        const afterIndependentClose = {
          kernels: (await directory.kernels()).length,
          connections: (await directory.connections()).length,
        };

        document.body.dataset.result = JSON.stringify({
          distinctKernels,
          producerSigner: produced.artifact.signer,
          receiverSigner: receiverProduced.artifact.signer,
          producerPhases: produced.phases,
          receiverPhases: received.phases,
          registeredWithoutTrust:
            registeredKernels.length === 2 &&
            registeredConnections.length === 4 &&
            !produced.phases.includes("signer-trusted"),
          selectedIndependently: selectedProducer && selectedReceiver,
          kernelIds: registeredKernels.map(({ id }) => id),
          connectionKernels: registeredConnections.map(
            ({ kernelId }) => kernelId,
          ),
          liveKernelCloseError,
          afterProducerClose,
          receiverSurvivedProducerClose:
            receiverAfterProducerClose.kind === "hol-theorem",
          afterIndependentClose,
          wrongBytesError,
          wrongSignatureError,
          validAttackerKeyError,
          receiverStateUnchangedBeforeTrust:
            beforePin === afterAttacker && beforePin === afterPin,
          wrongNamespaceError,
          ownershipPreserved:
            produced.artifact.image.byteLength === originalImageLength &&
            produced.artifact.publicKey.byteLength ===
              originalPublicKeyLength &&
            produced.artifact.signature.byteLength === originalSignatureLength,
          importedContext: received.context,
          importedConclusion: received.conclusion,
          producerConclusion: produced.conclusion,
          witBoundary: {
            distinctIdentities:
              witProducerIdentity.signer !== witReceiverIdentity.signer,
            producerIdentityMatchesEndpoint:
              witProducerIdentity.signer === producerKernel.signer,
            receiverIdentityMatchesEndpoint:
              witReceiverIdentity.signer === receiverKernel.signer,
            producerPhases: witProduced.phases,
            receiverPhases: witReceived.phases,
            wrongSignatureRejected: /signature-authenticated/.test(
              witWrongSignatureError,
            ),
            coherentAttackerRejected: /signer-pinned/.test(witAttackerKeyError),
            stateUnchangedBeforeTrust:
              witBeforePin === witAfterAttacker && witBeforePin === witAfterPin,
            selectedProducer:
              witPinned.expectedDirectoryId ===
                witProducerIdentity.directoryId &&
              witPinned.signer === witProducerIdentity.signer,
            conclusionPreserved:
              witReceived.conclusion === witProduced.conclusion,
          },
        });
      } catch (error) {
        document.body.dataset.error = String(error);
      } finally {
        await producer?.close();
        await receiver?.close();
        await receiverProbe?.close();
        await wrongNamespaceReceiver?.close();
        await witProducerConnection?.close();
        await witReceiverConnection?.close();
        await directory.close();
      }
    </script>
  </body>
</html>
