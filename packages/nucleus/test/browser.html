<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nucleus browser kernel test</title>
  </head>
  <body>
    <script type="module">
      import { createBrowserRepl } from "../dist/index.js";

      const repl = createBrowserRepl();
      const customSchema = {
        version: 1,
        columns: [
          { table: "node", name: "origin", storage: "text" },
          { table: "node", name: "priority", storage: "integer" },
          { table: "node", name: "payload", storage: "blob" },
        ],
        indexes: [
          {
            table: "node",
            name: "by_origin",
            columns: ["origin"],
          },
        ],
      };
      let source;
      let target;
      let hol;
      let trustedHol;
      let observerHol;
      let secondKernelSql;
      let secondKernelHol;
      let url;
      try {
        const initialKernel = await repl.kernel(0);
        const secondKernel = await repl.createKernel();
        const kernelDirectory = await repl.kernels();
        const kernelDirectoryMatches =
          kernelDirectory.length === 2 &&
          kernelDirectory.every(
            (kernel, id) =>
              kernel.id === id &&
              kernel.transport === "local" &&
              kernel.endpoint === null,
          );
        const kernelKeysDiffer = secondKernel.publicKey.some(
          (byte, index) => byte !== initialKernel.publicKey[index],
        );
        let malformedRemoteKeyRejected = false;
        try {
          await repl.connectFetch({
            endpoint: `${location.origin}/unused-kernel/`,
            publicKey: new Uint8Array(31),
          });
        } catch {
          malformedRemoteKeyRejected = true;
        }
        const compiledDescriptor = await repl.compileHolSchema(customSchema);
        secondKernelSql = await repl.openAt(secondKernel.id);
        const secondKernelSqlResult = await secondKernelSql.run(
          "SELECT 126 AS independently_routed",
        );
        secondKernelHol = await repl.openHolAt(secondKernel.id, {
          kind: "schema",
          schema: customSchema,
        });
        const secondTruth = await secondKernelHol.boolTerm(true);
        const callerMetadataBlob = new Uint8Array([0, 255, 128]);
        const setMetadata = secondKernelHol.setMetadata(
          { kind: "node", id: secondTruth },
          [
            {
              column: "origin",
              value: { kind: "text", value: "browser demo" },
            },
            {
              column: "priority",
              value: { kind: "integer", value: "9223372036854775807" },
            },
            {
              column: "payload",
              value: { kind: "blob", value: callerMetadataBlob },
            },
          ],
        );
        callerMetadataBlob.fill(7);
        await setMetadata;
        const secondKernelMetadata = await secondKernelHol.metadata(
          { kind: "node", id: secondTruth },
          ["payload", "priority", "origin"],
        );
        let nonByteBlobRejected = false;
        try {
          await secondKernelHol.setMetadata({ kind: "node", id: secondTruth }, [
            { column: "payload", value: { kind: "blob", value: [1, 2] } },
          ]);
        } catch {
          nonByteBlobRejected = true;
        }
        let oversizedMetadataRejected = false;
        try {
          await secondKernelHol.setMetadata({ kind: "node", id: secondTruth }, [
            {
              column: "payload",
              value: { kind: "blob", value: new Uint8Array(1 << 20) },
            },
          ]);
        } catch {
          oversizedMetadataRejected = true;
        }
        let expandingMetadataRejected = false;
        try {
          await secondKernelHol.setMetadata({ kind: "node", id: secondTruth }, [
            {
              column: "origin",
              value: { kind: "text", value: '"'.repeat(600_000) },
            },
          ]);
        } catch {
          expandingMetadataRejected = true;
        }
        const secondKernelSnapshot = await secondKernelHol.exportSnapshot();
        const secondKernelSnapshotKeyMatches =
          secondKernelSnapshot.publicKey.length ===
            secondKernel.publicKey.length &&
          secondKernelSnapshot.publicKey.every(
            (byte, index) => byte === secondKernel.publicKey[index],
          );
        const secondKernelDescriptorMatches =
          secondKernelSnapshot.descriptor.length ===
            compiledDescriptor.length &&
          secondKernelSnapshot.descriptor.every(
            (byte, index) => byte === compiledDescriptor[index],
          );
        await secondKernelSql.close();
        secondKernelSql = undefined;
        await secondKernelHol.close();
        secondKernelHol = undefined;
        source = await repl.open();
        target = await repl.open();
        hol = await repl.openHol({ kind: "schema", schema: customSchema });
        await source.run("CREATE TABLE facts (name TEXT, value INTEGER)");
        await source.run(
          "INSERT INTO facts VALUES ('exact', 9223372036854775807)",
        );
        const image = await source.serializeMain();
        url = URL.createObjectURL(new Blob([image]));
        const hash = await target.loadUrl(url, "library");
        const result = await target.run(
          "SELECT name, value FROM library.facts",
        );

        let readonly = false;
        try {
          await target.run("INSERT INTO library.facts VALUES ('no', 0)");
        } catch {
          readonly = true;
        }

        const truth = await hol.boolTerm(true);
        const proofRecipe = await hol.runProofScript({
          version: 1,
          steps: [
            { op: "truth", context: 0 },
            { op: "persist_theorem", theorem: 0 },
          ],
        });
        const freeType = await hol.freeType(900);
        const freeTypeView = await hol.type(freeType);
        const boolType = await hol.boolType();
        const schematicTerm = await hol.freeTerm(901, freeType);
        const booleanTerm = await hol.freeTerm(901, boolType);
        const expectedInstantiatedEquality = await hol.equality(
          booleanTerm,
          booleanTerm,
        );
        const typeInstantiationRecipe = await hol.runProofScript({
          version: 1,
          steps: [
            { op: "reflexivity", context: 0, term: schematicTerm },
            {
              op: "instantiate_types",
              theorem: 0,
              instantiations: [{ variable: freeType, replacement: boolType }],
            },
          ],
        });
        let unknownProofFieldRejected = false;
        try {
          await hol.runProofScript({
            version: 1,
            steps: [{ op: "truth", context: 0, unknown: true }],
          });
        } catch {
          unknownProofFieldRejected = true;
        }
        const namespace = await hol.createNamespace(0, "demo");
        await hol.bindExport(namespace, 7, "term", truth, "truth");
        const namespaceView = await hol.namespace(namespace);
        const exportView = await hol.namespaceExport(namespace, 7);
        const resolved = await hol.resolveExportName(namespace, "truth");
        const snapshot = await hol.exportSnapshot();
        const residentHash = await repl.putHolSnapshot(snapshot);
        const compiledDescriptorMatches =
          compiledDescriptor.length === snapshot.descriptor.length &&
          compiledDescriptor.every(
            (byte, index) => byte === snapshot.descriptor[index],
          );
        const attestation = {
          schema: snapshot.schema,
          image: snapshot.image,
          signer: snapshot.signer,
          publicKey: snapshot.publicKey,
          signature: snapshot.signature,
        };
        await hol.close();
        hol = undefined;

        const malformedDescriptor = snapshot.descriptor.slice();
        malformedDescriptor[0] ^= 1;
        let malformedDescriptorRejected = false;
        try {
          const invalid = await repl.openHol({
            kind: "descriptor",
            descriptor: malformedDescriptor,
          });
          await invalid.close();
        } catch {
          malformedDescriptorRejected = true;
        }
        let ambiguousSchemaSourceRejected = false;
        try {
          await repl.openHol({
            kind: "descriptor",
            descriptor: snapshot.descriptor,
            schema: customSchema,
          });
        } catch {
          ambiguousSchemaSourceRejected = true;
        }
        trustedHol = await repl.openHol({
          kind: "descriptor",
          descriptor: snapshot.descriptor,
        });
        const callerPublicKey = attestation.publicKey.slice();
        const callerSignature = attestation.signature.slice();
        const trustPromise = trustedHol.trustImport({
          ...attestation,
          publicKey: callerPublicKey,
          signature: callerSignature,
        });
        callerPublicKey.fill(0);
        callerSignature.fill(0);
        const trustedImport = await trustPromise;
        const inspectedImport = await trustedHol.trustedImport(
          trustedImport.trustedImportId,
        );
        const importedNamespace = await trustedHol.importNamespace(
          trustedImport.importId,
          namespace,
          null,
          "downloaded-demo",
        );
        const importedExport = await trustedHol.inspectResidentTrustedExport(
          trustedImport.trustedImportId,
          importedNamespace,
          7,
          snapshot.image,
        );

        observerHol = await repl.openHol();
        let observerReadRejected = false;
        try {
          await observerHol.trustedImport(trustedImport.trustedImportId);
        } catch {
          observerReadRejected = true;
        }
        const tamperedSignature = snapshot.signature.slice();
        tamperedSignature[0] ^= 1;
        let tamperedRejected = false;
        try {
          await observerHol.trustImport({
            ...attestation,
            signature: tamperedSignature,
          });
        } catch {
          tamperedRejected = true;
        }

        const trustedSnapshot = await trustedHol.exportSnapshot();
        const observerSnapshot = await observerHol.exportSnapshot();
        const snapshotHash = await target.putImage(snapshot.bytes);
        await target.attachImage(snapshotHash, "hol_snapshot");
        const trustedSnapshotHash = await target.putImage(
          trustedSnapshot.bytes,
        );
        await target.attachImage(trustedSnapshotHash, "trusted_snapshot");
        const observerSnapshotHash = await target.putImage(
          observerSnapshot.bytes,
        );
        await target.attachImage(observerSnapshotHash, "observer_snapshot");
        const snapshotRows = await target.run(
          "SELECT namespace_id, export_id, sort, local_id, name FROM hol_snapshot.hol_namespace_export",
        );
        const trustedRows = await target.run(
          "SELECT i.import_id, hex(i.schema_hash), hex(i.image_hash), t.trusted_import_id, hex(t.signer_hash), length(t.public_key), length(t.signature) FROM trusted_snapshot.hol_import AS i JOIN trusted_snapshot.hol_trusted_import AS t USING (import_id)",
        );
        const observerRows = await target.run(
          "SELECT (SELECT count(*) FROM observer_snapshot.hol_import), (SELECT count(*) FROM observer_snapshot.hol_trusted_import)",
        );

        document.body.dataset.result = JSON.stringify({
          kernelKeysDiffer,
          malformedRemoteKeyRejected,
          kernelDirectoryMatches,
          secondKernelSqlResult,
          secondKernelSnapshotKeyMatches,
          secondKernelDescriptorMatches,
          secondKernelMetadata: secondKernelMetadata.map((value) =>
            value.kind === "blob"
              ? { ...value, value: Array.from(value.value) }
              : value,
          ),
          nonByteBlobRejected,
          oversizedMetadataRejected,
          expandingMetadataRejected,
          hash,
          result,
          readonly,
          namespace,
          namespaceView,
          exportView,
          resolved,
          snapshotHash,
          residentHash,
          snapshotImage: snapshot.image,
          snapshotSchema: snapshot.schema,
          snapshotSigner: snapshot.signer,
          publicKeyLength: snapshot.publicKey.length,
          signatureLength: snapshot.signature.length,
          descriptorLength: snapshot.descriptor.length,
          compiledDescriptorMatches,
          malformedDescriptorRejected,
          ambiguousSchemaSourceRejected,
          attestationHasBytes: "bytes" in attestation,
          snapshotRows,
          proofRecipe,
          freeTypeView,
          expectedInstantiatedEquality,
          typeInstantiationRecipe,
          unknownProofFieldRejected,
          trustedImport,
          inspectedImport,
          importedNamespace,
          importedExport,
          tamperedRejected,
          observerReadRejected,
          trustedRows,
          observerRows,
        });
      } catch (error) {
        document.body.dataset.error = String(error);
      } finally {
        if (url !== undefined) URL.revokeObjectURL(url);
        await source?.close();
        await target?.close();
        await hol?.close();
        await trustedHol?.close();
        await observerHol?.close();
        await secondKernelSql?.close();
        await secondKernelHol?.close();
        repl.close();
      }
    </script>
  </body>
</html>
