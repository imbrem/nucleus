<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nucleus browser kernel test</title>
  </head>
  <body>
    <script type="module">
      import { createBrowserRepl } from "../dist/index.js";

      const repl = createBrowserRepl();
      let source;
      let target;
      let hol;
      let signedReceiver;
      let url;
      try {
        source = await repl.open();
        target = await repl.open();
        hol = await repl.openHol();
        await source.run("CREATE TABLE facts (name TEXT, value INTEGER)");
        await source.run(
          "INSERT INTO facts VALUES ('exact', 9223372036854775807)",
        );
        const image = await source.serializeMain();
        url = URL.createObjectURL(new Blob([image]));
        const hash = await target.loadUrl(url, "library");
        const result = await target.run(
          "SELECT name, value FROM library.facts",
        );
        const theorem = await hol.run("beta true");
        const signed = await hol.runSignedRoundTrip();
        const { receiver, ...signedResult } = signed;
        signedReceiver = receiver;

        let readonly = false;
        try {
          await target.run("INSERT INTO library.facts VALUES ('no', 0)");
        } catch {
          readonly = true;
        }

        document.body.dataset.result = JSON.stringify({
          hash,
          result,
          readonly,
          theorem,
          signed: {
            ...signedResult,
            image: signed.image.byteLength,
            publicKey: signed.publicKey.byteLength,
            signature: signed.signature.byteLength,
            attestation: signed.attestation.startsWith(
              "format=covalence-repl-signed-snapshot-demo-v0",
            ),
          },
        });
      } catch (error) {
        document.body.dataset.error = String(error);
      } finally {
        if (url !== undefined) URL.revokeObjectURL(url);
        await source?.close();
        await target?.close();
        await hol?.close();
        await signedReceiver?.close();
        repl.close();
      }
    </script>
  </body>
</html>
