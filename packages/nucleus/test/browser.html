<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nucleus browser kernel test</title>
  </head>
  <body>
    <script type="module">
      import { createBrowserRepl } from "../dist/index.js";
      import { CLOSED_BETA_RECIPE } from "./closed-beta-recipe.mjs";

      const repl = createBrowserRepl();
      const receiverRepl = createBrowserRepl();
      let source;
      let target;
      let hol;
      let signedReceiver;
      let missingZero;
      let missingZeroState;
      let receivedHandoff;
      let receivedHandoffState;
      let missingZeroReopened;
      let replayedRecipe;
      let replayedRecipeState;
      let url;
      try {
        source = await repl.open();
        target = await repl.open();
        hol = await repl.openHol();
        await source.run("CREATE TABLE facts (name TEXT, value INTEGER)");
        await source.run(
          "INSERT INTO facts VALUES ('exact', 9223372036854775807)",
        );
        const image = await source.serializeMain();
        url = URL.createObjectURL(new Blob([image]));
        const hash = await target.loadUrl(url, "library");
        const result = await target.run(
          "SELECT name, value FROM library.facts",
        );
        const theorem = await hol.run("beta true");
        const signed = await hol.runSignedRoundTrip();
        const { receiver, ...signedResult } = signed;
        signedReceiver = receiver;
        let malformedRecipeRejected = false;
        try {
          const unexpected = await repl.replayHolProofRecipe(
            new Uint8Array([0xff]),
          );
          await unexpected.cleanup();
        } catch {
          malformedRecipeRejected = true;
        }
        const mutableRecipe = CLOSED_BETA_RECIPE.slice();
        const replayPromise = repl.replayHolProofRecipe(mutableRecipe);
        mutableRecipe.fill(0);
        replayedRecipe = await replayPromise;
        replayedRecipeState = await replayedRecipe.openTrustedState();
        const replayedRecipeTruth =
          await replayedRecipeState.connection.run("truth");
        missingZero = await repl.proveNatLikeMissingZero();
        const sidecar = new TextEncoder().encode(missingZero.attestation);
        let wrongKeyRejected = false;
        try {
          const unexpectedlyReceived =
            await receiverRepl.receiveSignedHolArtifact({
              expectedPublicKey: new Uint8Array(32),
              image: missingZero.image,
              sidecar,
            });
          await unexpectedlyReceived.cleanup();
        } catch {
          wrongKeyRejected = true;
        }
        receivedHandoff = await receiverRepl.receiveSignedHolArtifact({
          expectedPublicKey: missingZero.publicKey,
          image: missingZero.image,
          sidecar,
        });
        missingZeroState = await missingZero.openTrustedState();
        const missingZeroTruth = await missingZeroState.connection.run("truth");
        missingZeroReopened = {
          sourceNamespace: missingZeroState.sourceNamespace,
          context: missingZeroState.context,
          conclusion: missingZeroState.conclusion,
          truth: missingZeroTruth.statement,
        };
        await missingZeroState.connection.close();
        missingZeroState = undefined;
        await missingZero.cleanup();

        receivedHandoffState = await receivedHandoff.openTrustedState();
        const receivedHandoffTruth =
          await receivedHandoffState.connection.run("truth");

        let readonly = false;
        try {
          await target.run("INSERT INTO library.facts VALUES ('no', 0)");
        } catch {
          readonly = true;
        }

        document.body.dataset.result = JSON.stringify({
          hash,
          result,
          readonly,
          theorem,
          signed: {
            ...signedResult,
            image: signed.image.byteLength,
            publicKey: signed.publicKey.byteLength,
            signature: signed.signature.byteLength,
            attestation:
              signed.attestation.startsWith(
                "format=covalence-repl-signed-snapshot-demo-v0",
              ) && signed.attestation.includes(`namespace=${signed.namespace}`),
          },
          replayedRecipe: {
            kind: replayedRecipe.kind,
            malformedRecipeRejected,
            sourceNamespace: replayedRecipe.sourceNamespace,
            image: replayedRecipe.image.byteLength,
            schema: replayedRecipe.schema,
            imageHash: replayedRecipe.imageHash,
            signer: replayedRecipe.signer,
            publicKey: replayedRecipe.publicKey.byteLength,
            signature: replayedRecipe.signature.byteLength,
            attestation: replayedRecipe.attestation.startsWith(
              "format=covalence-repl-signed-snapshot-demo-v0\n",
            ),
            context: replayedRecipe.context,
            conclusion: replayedRecipe.conclusion,
            reopened: {
              context: replayedRecipeState.context,
              conclusion: replayedRecipeState.conclusion,
              truth: replayedRecipeTruth.statement,
            },
          },
          missingZero: {
            kind: missingZero.kind,
            theoremOracle: missingZero.theoremOracle,
            namespace: missingZero.namespace,
            schema: missingZero.schema,
            imageHash: missingZero.imageHash,
            signer: missingZero.signer,
            context: missingZero.context,
            conclusion: missingZero.conclusion,
            image: missingZero.image.byteLength,
            publicKey: missingZero.publicKey.byteLength,
            signature: missingZero.signature.byteLength,
            attestation:
              missingZero.attestation.startsWith(
                "authority=kernel-derived-theorem\n",
              ) &&
              missingZero.attestation.includes(
                "theorem-oracle=(APP missing zero)\n",
              ) &&
              missingZero.attestation.includes(
                "intermediate-persistence=none\n",
              ),
            reopened: missingZeroReopened,
          },
          receivedHandoff: {
            kind: receivedHandoff.kind,
            wrongKeyRejected,
            distinctReceiverAfterSourceCleanup: true,
            attestationExact:
              receivedHandoff.attestation === missingZero.attestation,
            context: receivedHandoff.context,
            conclusion: receivedHandoff.conclusion,
            reopened: {
              context: receivedHandoffState.context,
              conclusion: receivedHandoffState.conclusion,
              truth: receivedHandoffTruth.statement,
            },
          },
        });
      } catch (error) {
        document.body.dataset.error = String(error);
      } finally {
        if (url !== undefined) URL.revokeObjectURL(url);
        await source?.close();
        await target?.close();
        await hol?.close();
        await signedReceiver?.close();
        await missingZero?.cleanup();
        await missingZeroState?.connection.close();
        await replayedRecipe?.cleanup();
        await replayedRecipeState?.connection.close();
        await receivedHandoff?.cleanup();
        await receivedHandoffState?.connection.close();
        repl.close();
        receiverRepl.close();
      }
    </script>
  </body>
</html>
