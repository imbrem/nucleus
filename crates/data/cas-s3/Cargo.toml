[package]
name = "covalence-data-cas-s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Async S3-compatible content-addressed storage"
publish = false

[dependencies]
# The SDK defaults to AWS-LC. Its sys/build-script layering is not yet
# representable by our generated Buck rules, while the supported Rustls/ring
# client is portable across both Cargo and Buck.
aws-config = { version = "1", default-features = false, features = ["credentials-process", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-smithy-types = "1"
bytes = "1"
covalence-data-cas = { path = "../cas" }
covalence-lib-error = { path = "../../lib/error" }
covalence-lib-hash = { path = "../../lib/hash", default-features = false, features = ["blake3"] }
covalence-logic-cas = { path = "../../logic/cas" }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
