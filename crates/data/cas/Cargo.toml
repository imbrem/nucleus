[package]
name = "covalence-data-cas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content-addressed byte sources for Covalence"
publish = false

[dependencies]
bytes = "1"
covalence-lib-error = { path = "../../lib/error" }
covalence-lib-hash = { path = "../../lib/hash", default-features = false, features = ["blake3"] }
covalence-logic-cas = { path = "../../logic/cas" }
# `RawTable` became private in hashbrown 0.17. `HashTable` is its safe,
# public pre-hashed-table API and preserves the intended Vec-plus-raw-index
# representation without pinning the older public raw API.
hashbrown = { version = "0.17", default-features = false }

[lints]
workspace = true
