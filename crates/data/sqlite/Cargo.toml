[package]
name = "covalence-data-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Untrusted SQLite data helpers and CAS-backed VFS support"
publish = false

[dependencies]
bytes = "1"
covalence-data-cas = { path = "../cas" }
covalence-lib-error = { path = "../../lib/error" }
covalence-lib-hash = { path = "../../lib/hash", default-features = false }
covalence-lib-sqlite = { path = "../../lib/sqlite", features = ["vfs-register"] }

[lints]
workspace = true
