[package]
name = "covalence-lib-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebAssembly runtimes shared by Covalence hosts and guests"
publish = false

[features]
default = []
browser = ["dep:wasm-bindgen"]
component-guest = ["dep:wit-bindgen-rt"]
component-host = ["dep:wasmtime", "dep:wasmtime-wasi"]
parser = ["dep:wasmparser"]

[dependencies]
wasmparser = { version = "=0.254.0", optional = true }
wit-bindgen-rt = { version = "=0.44.0", features = ["async", "bitflags"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "=48.0.1", default-features = false, features = [
  "anyhow",
  "async",
  "component-model",
  "component-model-async",
  "cranelift",
  "runtime",
  "std",
], optional = true }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p3"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "=0.2.121", optional = true }

[lints]
workspace = true
