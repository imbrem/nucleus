[package]
name = "covalence-lib-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLite binding used by Nucleus"
publish = false

[features]
default = ["serialize"]
serialize = ["rusqlite/serialize"]
vfs = ["dep:bitflags", "dep:covalence-data-cas", "dep:covalence-lib-hash"]
vfs-register = ["vfs", "dep:indexmap"]

[dependencies]
bitflags = { version = "2", optional = true }
covalence-data-cas = { path = "../../data/cas", optional = true }
covalence-lib-hash = { path = "../hash", default-features = false, optional = true }
indexmap = { version = "2", optional = true }

[dev-dependencies]
bytes = "1"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
rusqlite = "=0.40.1"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }

[lints]
workspace = true
