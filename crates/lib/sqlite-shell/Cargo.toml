[package]
name = "covalence-lib-sqlite-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The upstream SQLite command-line shell, embedded"
publish = false
build = "build.rs"

[dependencies]
# Depended on directly, not through `covalence-lib-sqlite`, so that this
# crate's build script receives `DEP_SQLITE3_INCLUDE`. Cargo publishes a
# `links` crate's metadata only to its immediate dependents.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
libsqlite3-sys = { version = "=0.38.1", features = ["bundled"] }

[dev-dependencies]
covalence-data-cas = { path = "../../data/cas" }
covalence-lib-sqlite = { path = "../sqlite", features = ["vfs-register"] }

[build-dependencies]
cc = "1"

[lints]
workspace = true
