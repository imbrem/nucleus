[package]
name = "covalence-lib-hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hashing primitives for Nucleus"
publish = false

[features]
default = ["blake3", "sha256", "git-sha1", "random"]
blake3 = []
sha256 = ["dep:sha2"]
git-sha1 = ["dep:sha1"]
random = ["dep:covalence-lib-rand"]

[dependencies]
blake3 = { version = "1" }
covalence-lib-error = { path = "../error" }
covalence-lib-rand = { path = "../rand", optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }

[lints]
workspace = true
