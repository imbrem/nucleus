[package]
name = "covalence-lib-hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hashing primitives for Nucleus"
publish = false

[features]
default = ["blake3", "sha256", "git-sha1", "random", "serde", "multiformats"]
blake3 = ["dep:blake3"]
sha256 = ["dep:sha2"]
git-sha1 = ["dep:sha1"]
random = ["dep:covalence-lib-rand"]
serde = ["dep:cid", "dep:serde"]
multiformats = ["dep:cid"]

[dependencies]
blake3 = { version = "1", optional = true }
cid = { version = "0.11", optional = true }
covalence-lib-error = { path = "../error" }
covalence-lib-rand = { path = "../rand", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
