[package]
name = "covalence-logic-hol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Raw Ethane HOL arena representation"
publish = false

[dependencies]
covalence-lib-cbor = { path = "../../lib/cbor" }
covalence-lib-error = { path = "../../lib/error" }
covalence-lib-hash = { path = "../../lib/hash", default-features = false, features = ["serde"] }
covalence-logic-cas = { path = "../cas" }
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
covalence-lib-json = { path = "../../lib/json" }

[lints]
workspace = true
