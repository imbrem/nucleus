[package]
name = "covalence-logic-hol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Raw Ethane HOL arena representation"
publish = false

[package.metadata.glu]
buck-test-features = ["buck-test-fixtures"]
buck-test-mapped-srcs = { "nucleus//:hol_init_checked_manifest" = "theories/init-boolean.checked.json", "nucleus//:hol_init_checked_schema" = "theories/init-boolean.checked.schema.json" }

[features]
buck-test-fixtures = []

[dependencies]
covalence-lib-cbor = { path = "../../lib/cbor" }
covalence-lib-error = { path = "../../lib/error" }
covalence-lib-hash = { path = "../../lib/hash", default-features = false, features = ["serde"] }
covalence-logic-cas = { path = "../cas" }
covalence-logic-classical = { path = "../classical" }
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde"] }

[dev-dependencies]
covalence-lib-json = { path = "../../lib/json" }

[lints]
workspace = true
