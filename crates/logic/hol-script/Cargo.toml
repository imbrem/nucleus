[package]
name = "covalence-logic-hol-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Untrusted S-expression front end for checked HOL definitions"
publish = false

[package.metadata.glu]
buck-test-features = ["buck-test-fixtures"]
buck-test-mapped-srcs = { "nucleus//:hol_init_checked_manifest" = "theories/init-boolean.checked.json", "nucleus//:hol_init_dag_json" = "theories/init.dag.json" }

[features]
buck-test-fixtures = []

[dependencies]
covalence-lib-error = { path = "../../lib/error" }
covalence-lib-json = { path = "../../lib/json" }
covalence-lib-parse = { path = "../../lib/parse" }
covalence-logic-hol = { path = "../hol" }
covalence-logic-hol-derived = { path = "../hol-derived" }

[lints]
workspace = true
