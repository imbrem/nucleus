[package]
name = "covalence-bin-nucleus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface for Nucleus"
publish = false

[[bin]]
name = "nucleus"
path = "src/main.rs"

[dependencies]
covalence-lib-error = { path = "../../lib/error" }
covalence-lib-hash = { path = "../../lib/hash", default-features = false, features = ["blake3"] }
covalence-repl = { path = "../../repl" }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
covalence-nucleus = { path = "../../nucleus" }

[dev-dependencies]
covalence-lib-sqlite = { path = "../../lib/sqlite" }
covalence-neutron = { path = "../../neutron" }

[lints]
workspace = true
