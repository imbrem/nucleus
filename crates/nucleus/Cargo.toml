[package]
name = "covalence-nucleus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable Nucleus facade with an explicit trusted-core assembly"
publish = false

[features]
buck-test-fixtures = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
covalence-data-cas = { path = "../data/cas" }
covalence-data-vfs = { path = "../data/vfs" }
covalence-lib-crypto = { path = "../lib/crypto" }
covalence-lib-error = { path = "../lib/error" }
covalence-lib-hash = { path = "../lib/hash", default-features = false, features = ["blake3"] }
covalence-lib-rand = { path = "../lib/rand" }
covalence-logic-cas = { path = "../logic/cas" }
covalence-logic-hol = { path = "../logic/hol" }
covalence-nucleus-core = { path = "core" }
covalence-nucleus-script = { path = "script" }
covalence-nucleus-tactics = { path = "tactics" }
futures = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
covalence-lib-wasm = { path = "../lib/wasm", features = ["component-host"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "=0.2.121"

[target.'cfg(target_os = "wasi")'.dependencies]
wit-bindgen-rt = { version = "=0.44.0", features = ["async", "bitflags"] }

[package.metadata.component]
package = "nucleus:smoke"

[package.metadata.component.dependencies]

[package.metadata.glu]
buck-manifest-mapped-srcs = { "nucleus//:proof_wit" = "wit/proof/proof.wit" }
buck-test-features = ["buck-test-fixtures"]

[lints]
workspace = true
