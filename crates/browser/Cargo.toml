[package]
name = "covalence-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A content-addressed SQLite kernel for the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
covalence-data-cas = { path = "../data/cas" }
covalence-data-sqlite = { path = "../data/sqlite" }
covalence-lib-hash = { path = "../lib/hash", default-features = false, features = ["blake3"] }
covalence-lib-json = { path = "../lib/json" }
covalence-lib-sqlite = { path = "../lib/sqlite", features = ["vfs-register"] }
covalence-logic-classical = { path = "../logic/classical" }
covalence-logic-hol = { path = "../logic/hol" }
covalence-logic-lrat = { path = "../logic/lrat" }
covalence-repl = { path = "../repl" }
wasm-bindgen = "=0.2.121"

[lints]
workspace = true
