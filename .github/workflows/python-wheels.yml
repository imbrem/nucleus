name: Python wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        description: PEP 440 version to embed in a release wheel
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Development wheels inherit the workspace's Cargo version. A tagged
      # Python release supplies its PEP 440 version without changing the shared
      # version of every Rust crate in the workspace.
      - name: Set release version
        if: inputs.python-version != ''
        env:
          COVALENCE_PYTHON_VERSION: ${{ inputs.python-version }}
        shell: bash
        run: |
          python - "${COVALENCE_PYTHON_VERSION}" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("crates/ffi/python/pyproject.toml")
          source = path.read_text()
          marker = 'dynamic = ["version"]'
          assert source.count(marker) == 1
          path.write_text(source.replace(marker, f'version = "{sys.argv[1]}"'))
          PY

      # An explicit policy avoids silently raising the oldest supported glibc.
      # maturin runs in the matching official manylinux container and repairs
      # the wheel before returning it to the runner.
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          COVALENCE_PYTHON_VERSION: ${{ inputs.python-version }}
        with:
          command: build
          maturin-version: v1.11.5
          rust-toolchain: 1.97.1
          target: x86_64
          manylinux: 2_28
          docker-options: -e COVALENCE_PYTHON_VERSION
          args: >-
            --release
            --locked
            --compatibility pypi
            --manifest-path crates/ffi/python/Cargo.toml
            --out dist

      - name: Inspect wheel and record provenance
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/covalence-*-cp311-abi3-manylinux_2_28_x86_64.whl)
          test "${#wheels[@]}" -eq 1
          python -m zipfile --list "${wheels[0]}"
          (
            cd dist
            sha256sum -- covalence-*.whl > SHA256SUMS
          )
          jq --null-input \
            --arg commit "${GITHUB_SHA}" \
            --arg python_version "${{ inputs.python-version }}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '{commit: $commit, python_version: (if $python_version == "" then null else $python_version end), run_id: $run_id, run_attempt: $run_attempt, repository: $repository, platform: "linux-x86_64", manylinux: "2_28"}' \
            > dist/BUILD-METADATA.json

      # Install the completed artifact into a venv outside the checkout. Running
      # pytest from there prevents the source package from shadowing the wheel.
      - name: Test installed wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          test_root="${RUNNER_TEMP}/covalence-wheel-test"
          python -m venv "${test_root}/venv"
          "${test_root}/venv/bin/python" -m pip install --disable-pip-version-check pytest==9.1.1
          "${test_root}/venv/bin/python" -m pip install --disable-pip-version-check dist/covalence-*.whl
          cd "${test_root}"
          "${test_root}/venv/bin/python" - <<'PY'
          import importlib.metadata
          import pathlib
          import sys

          import covalence
          from covalence.cas import CasAssertion
          from covalence.data.cbor import Cbor
          from covalence.lib.hash import O256
          from covalence.logic.hol import Kernel

          package = pathlib.Path(covalence.__file__).resolve()
          assert package.is_relative_to(pathlib.Path(sys.prefix).resolve())
          assert covalence.__version__ == importlib.metadata.version("covalence")
          assert Cbor.integer(7) == 7
          blob = b"installed wheel"
          assert CasAssertion(O256.hash(blob), blob).check().blob == blob
          kernel = Kernel()
          assert kernel.tm(kernel.bool(kernel.bool_ty(kernel.star()), True)).reference > 0
          print(package)
          print(covalence.__version__)
          PY
          "${test_root}/venv/bin/python" -m pytest \
            "${GITHUB_WORKSPACE}/crates/ffi/python/tests/test_package.py" \
            "${GITHUB_WORKSPACE}/crates/ffi/python/tests/test_typing.py" \
            "${GITHUB_WORKSPACE}/crates/ffi/python/tests/test_hash.py" \
            "${GITHUB_WORKSPACE}/crates/ffi/python/tests/test_cbor.py" \
            "${GITHUB_WORKSPACE}/crates/ffi/python/tests/test_cas.py" \
            "${GITHUB_WORKSPACE}/crates/ffi/python/tests/test_hol.py" \
            -q -p no:cacheprovider

      - name: Upload commit-addressed wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: covalence-linux-x86_64-${{ github.sha }}
          path: |
            dist/covalence-*.whl
            dist/SHA256SUMS
            dist/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 30
